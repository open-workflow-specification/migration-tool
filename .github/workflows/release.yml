name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-native:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: swf-migrate-linux
            binary: target/swf-migrate
          - os: macos-latest
            artifact: swf-migrate-macos
            binary: target/swf-migrate
          - os: windows-latest
            artifact: swf-migrate-windows.exe
            binary: target/swf-migrate.exe

    steps:
      - uses: actions/checkout@v4

      - name: Set up GraalVM JDK 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'

      - name: Install v08 SDK into local Maven repo
        shell: bash
        run: |
          mvn dependency:get -q -Dartifact=io.serverlessworkflow:serverlessworkflow-api:4.1.0.Final
          mvn install:install-file -q \
            -Dfile="${HOME}/.m2/repository/io/serverlessworkflow/serverlessworkflow-api/4.1.0.Final/serverlessworkflow-api-4.1.0.Final.jar" \
            -DgroupId=io.serverlessworkflow.v08 \
            -DartifactId=serverlessworkflow-api \
            -Dversion=4.1.0.Final \
            -Dpackaging=jar

      - name: Build native binary
        run: mvn package -Pnative -q

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}

  release:
    name: Create release
    needs: build-native
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename artifacts
        run: |
          mv artifacts/swf-migrate-linux/swf-migrate        swf-migrate-linux
          mv artifacts/swf-migrate-macos/swf-migrate        swf-migrate-macos
          mv artifacts/swf-migrate-windows.exe/swf-migrate.exe swf-migrate-windows.exe

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            swf-migrate-linux
            swf-migrate-macos
            swf-migrate-windows.exe
          generate_release_notes: true
